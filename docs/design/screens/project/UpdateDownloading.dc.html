<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Обновление — загрузка</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#772CE8}a:hover{color:#5C16C5}
</style>
</helmet>
<div style="width: 1280px; height: 720px; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #17151F">
  <dc-import name="Update" state="{{mode}}" hint-size="1280px,720px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() { return { mode: 'downloading' }; }
}
</script>
</body>
</html>
