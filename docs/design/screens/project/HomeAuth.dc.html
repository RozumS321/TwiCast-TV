<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Главная — авторизован</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#772CE8}a:hover{color:#5C16C5}
button{font-family:inherit}
</style>
</helmet>
<div style="position: relative; width: 1280px; height: 720px; overflow: hidden; background: #F6F5FA; color: #17151F; font-family: 'Plus Jakarta Sans', system-ui, sans-serif">
  <main style="position: absolute; left: 88px; right: 0; top: 0; bottom: 0; padding: 30px 0 0 40px; display: flex; flex-direction: column; gap: 22px">
    <header style="display: flex; align-items: baseline; gap: 14px; padding-right: 40px">
      <h1 style="margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -0.02em">С возвращением, nightowl</h1>
      <span style="font-size: 15px; color: #5F5A6E">4 канала из подписок сейчас в эфире</span>
    </header>

    <sc-for list="{{rows}}" as="row" hint-placeholder-count="3">
      <section style="display: flex; flex-direction: column; gap: 12px">
        <div style="display: flex; align-items: baseline; gap: 10px">
          <h2 style="margin: 0; font-size: 20px; font-weight: 800">{{row.title}}</h2>
          <span style="font-size: 13px; color: #5F5A6E">{{row.hint}}</span>
        </div>
        <div style="display: flex; gap: 22px; padding: 6px 0 6px 4px">
          <sc-for list="{{row.items}}" as="s" hint-placeholder-count="5">
            <button onClick="{{s.pick}}" aria-label="{{s.channel}}: {{s.title}}" style="{{s.cardStyle}}">
              <span style="{{s.thumb}}">
                <span style="{{s.art}}"></span>
                <span style="position: absolute; left: 9px; top: 9px; padding: 3px 7px; border-radius: 6px; background: #E91916; color: #FFFFFF; font-size: 10px; font-weight: 800; letter-spacing: .04em">LIVE</span>
                <span style="position: absolute; left: 9px; bottom: 9px; padding: 3px 8px; border-radius: 6px; background: rgba(15,14,20,.72); color: #FFFFFF; font-size: 11px; font-weight: 700">{{s.viewers}}</span>
              </span>
              <span style="display: flex; gap: 10px; align-items: flex-start; padding: 0 4px">
                <span style="{{s.avatar}}"></span>
                <span style="display: flex; flex-direction: column; gap: 2px; min-width: 0; text-align: left">
                  <span style="font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{s.channel}}</span>
                  <span style="font-size: 12px; color: #5F5A6E; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{s.category}}</span>
                </span>
              </span>
            </button>
          </sc-for>
        </div>
      </section>
    </sc-for>
  </main>
  <div style="position: absolute; left: 0; top: 0; bottom: 0">
    <dc-import name="Rail" expanded="{{no}}" active="home" auth="{{yes}}" hint-size="88px,720px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { focus: '0-0' }; }
  renderVals() {
    const A = '#9146FF';
    const tones = [['#2B1E4A', '#FF8A5B'], ['#123A3A', '#64E0C6'], ['#3A1E2E', '#FFC857'], ['#1C2A48', '#7FB2FF'], ['#30261A', '#FF6B9A']];
    const defs = [
      ['В эфире из ваших подписок', 'обновлено только что', [
        ['pixelmira', 'Just Chatting', '18,2 тыс'], ['kotofey', 'Minecraft', '6,4 тыс'], ['devstream_ua', 'Программирование', '2,1 тыс'], ['lofi_room', 'Музыка', '3,3 тыс'], ['smoke_lab', 'Counter-Strike', '2,4 тыс']]],
      ['Рекомендации', 'по вашим категориям', [
        ['tactic_room', 'Counter-Strike', '1,6 тыс'], ['blocky_art', 'Minecraft', '890'], ['rust_and_tea', 'Программирование', '640'], ['jazz_cat', 'Музыка', '1,1 тыс'], ['arena_ua', 'Counter-Strike', '7,1 тыс']]],
      ['Популярное в регионе', 'Украина · русский', [
        ['mid_or_feed', 'Dota 2', '12,7 тыс'], ['nightowl_plays', 'Counter-Strike', '9,8 тыс'], ['kira_aim', 'Valorant', '1,9 тыс'], ['vaskaa', 'GTA V', '980'], ['owl_squad', 'Fortnite', '870']]]
    ];
    const rows = defs.map((r, ri) => ({
      title: r[0], hint: r[1],
      items: r[2].map((d, i) => {
        const id = ri + '-' + i, f = this.state.focus === id, t = tones[(i + ri * 2) % 5];
        return {
          channel: d[0], category: d[1], viewers: d[2], title: d[1],
          pick: () => this.setState({ focus: id }),
          cardStyle: 'all: unset; cursor: pointer; flex-shrink: 0; width: 212px; display: flex; flex-direction: column; gap: 8px; padding-bottom: 8px; border-radius: 16px; transition: transform .2s, box-shadow .2s; ' +
            (f ? 'transform: scale(1.06); background: #FFFFFF; box-shadow: 0 0 0 3px ' + A + ', 0 18px 36px rgba(145,70,255,.28); z-index: 2;' : ''),
          thumb: 'position: relative; overflow: hidden; display: block; width: 212px; height: 119px; border-radius: 14px; background: ' + t[0] + ';',
          art: 'position: absolute; width: 50%; aspect-ratio: 1; border-radius: 50%; right: ' + (8 + (i * 11) % 28) + '%; top: ' + (6 + (i * 9) % 26) + '%; background: ' + t[1] + '; opacity: .9;',
          avatar: 'width: 30px; height: 30px; flex-shrink: 0; border-radius: 15px; background: ' + t[1] + ';' + (ri === 0 ? ' box-shadow: 0 0 0 2px #FFFFFF, 0 0 0 4px #9146FF;' : '')
        };
      })
    }));
    return { rows, yes: true, no: false };
  }
}
</script>
</body>
</html>
