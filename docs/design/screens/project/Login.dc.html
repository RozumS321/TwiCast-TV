<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Вход — Device Flow</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#772CE8}a:hover{color:#5C16C5}
button{font-family:inherit}
</style>
</helmet>
<div style="position: relative; width: 1280px; height: 720px; overflow: hidden; background: #F6F5FA; color: #17151F; font-family: 'Plus Jakarta Sans', system-ui, sans-serif">
  <main style="position: absolute; left: 88px; right: 0; top: 0; bottom: 0; display: flex; align-items: center; justify-content: center">
    <section aria-label="Вход в аккаунт" style="width: 960px; box-sizing: border-box; padding: 44px 48px; border-radius: 28px; background: #FFFFFF; box-shadow: 0 24px 60px rgba(23,21,31,.10); display: flex; gap: 48px; align-items: center">

      <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 22px">
        <div style="display: flex; flex-direction: column; gap: 8px">
          <span style="font-size: 13px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: #772CE8">Вход через Twitch</span>
          <h1 style="margin: 0; font-size: 32px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.15">Войдите с телефона — без ввода пароля на пульте</h1>
        </div>
        <ol style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 14px">
          <li style="display: flex; gap: 14px; align-items: center">
            <span style="width: 32px; height: 32px; flex-shrink: 0; border-radius: 16px; background: #F1EAFF; color: #5C16C5; font-weight: 800; display: flex; align-items: center; justify-content: center">1</span>
            <span style="font-size: 16px; color: #3E3A4A">Отсканируйте QR-код или откройте <b style="color: #17151F">twitch.tv/activate</b></span>
          </li>
          <li style="display: flex; gap: 14px; align-items: center">
            <span style="width: 32px; height: 32px; flex-shrink: 0; border-radius: 16px; background: #F1EAFF; color: #5C16C5; font-weight: 800; display: flex; align-items: center; justify-content: center">2</span>
            <span style="font-size: 16px; color: #3E3A4A">Введите код с экрана</span>
          </li>
          <li style="display: flex; gap: 14px; align-items: center">
            <span style="width: 32px; height: 32px; flex-shrink: 0; border-radius: 16px; background: #F1EAFF; color: #5C16C5; font-weight: 800; display: flex; align-items: center; justify-content: center">3</span>
            <span style="font-size: 16px; color: #3E3A4A">Подтвердите вход — телевизор войдёт сам</span>
          </li>
        </ol>
        <div style="display: flex; flex-direction: column; gap: 8px">
          <span style="font-size: 13px; font-weight: 700; color: #5F5A6E">Ваш код</span>
          <div style="display: flex; gap: 8px; align-items: center">
            <sc-for list="{{code}}" as="c" hint-placeholder-count="9">
              <span style="{{c.style}}">{{c.ch}}</span>
            </sc-for>
          </div>
        </div>
        <div style="display: flex; align-items: center; gap: 16px">
          <span style="display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 700; color: #5C16C5">
            <span style="width: 10px; height: 10px; border-radius: 5px; background: #9146FF; box-shadow: 0 0 0 5px rgba(145,70,255,.18)"></span>
            Ждём подтверждения…
          </span>
          <span style="font-size: 14px; color: #5F5A6E">Код действует ещё 9:41</span>
          <span style="flex-grow: 1"></span>
          <button style="height: 48px; padding: 0 20px; border-radius: 14px; border: 1px solid #E2DFEA; background: #FFFFFF; font-size: 15px; font-weight: 700; color: #17151F">Новый код</button>
        </div>
      </div>

      <figure style="margin: 0; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 12px">
        <div role="img" aria-label="QR-код для входа (заглушка)" style="box-sizing: border-box; width: 264px; height: 264px; padding: 18px; border-radius: 22px; background: #FFFFFF; box-shadow: 0 0 0 1px #E8E5F0, 0 12px 30px rgba(23,21,31,.08); display: grid; grid-template-columns: repeat(21, minmax(0, 1fr)); gap: 0">
          <sc-for list="{{qr}}" as="q" hint-placeholder-count="441">
            <span style="{{q}}"></span>
          </sc-for>
        </div>
        <figcaption style="font-size: 13px; color: #5F5A6E">Наведите камеру телефона</figcaption>
      </figure>
    </section>
  </main>
  <div style="position: absolute; left: 0; top: 0; bottom: 0">
    <dc-import name="Rail" expanded="{{no}}" active="profile" hint-size="88px,720px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    const code = 'WDJB-MJHT'.split('').map((ch) => ({
      ch,
      style: ch === '-' ? 'font-size: 28px; font-weight: 800; color: #B7B2C4; padding: 0 2px;'
        : 'width: 48px; height: 60px; border-radius: 12px; background: #F6F5FA; box-shadow: inset 0 0 0 1px #E2DFEA; display: flex; align-items: center; justify-content: center; font-size: 30px; font-weight: 800; letter-spacing: .02em; color: #17151F;'
    }));
    const N = 21;
    const finder = (r, c) => {
      const inBox = (r0, c0) => r >= r0 && r < r0 + 7 && c >= c0 && c < c0 + 7;
      for (const [r0, c0] of [[0, 0], [0, 14], [14, 0]]) {
        if (inBox(r0, c0)) {
          const y = r - r0, x = c - c0;
          return (y === 0 || y === 6 || x === 0 || x === 6) || (y >= 2 && y <= 4 && x >= 2 && x <= 4);
        }
      }
      return null;
    };
    const qr = [];
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
      const f = finder(r, c);
      const on = f !== null ? f : (((r * 7 + c * 13 + r * c) % 5) < 2);
      qr.push('display: block; aspect-ratio: 1; background: ' + (on ? '#17151F' : 'transparent') + ';');
    }
    return { code, qr, no: false };
  }
}
</script>
</body>
</html>
