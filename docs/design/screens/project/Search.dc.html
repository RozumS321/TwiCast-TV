<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Поиск</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#772CE8}a:hover{color:#5C16C5}
button{font-family:inherit}
</style>
</helmet>
<div style="position: relative; width: 1280px; height: 720px; overflow: hidden; background: #F6F5FA; color: #17151F; font-family: 'Plus Jakarta Sans', system-ui, sans-serif">
  <main style="position: absolute; left: 88px; right: 0; top: 0; bottom: 0; padding: 30px 40px 0 40px; display: flex; gap: 36px">

    <section aria-label="Ввод запроса" style="width: 392px; flex-shrink: 0; display: flex; flex-direction: column; gap: 16px">
      <div style="display: flex; align-items: center; gap: 12px; height: 60px; padding: 0 18px; border-radius: 18px; background: #FFFFFF; box-shadow: 0 0 0 2px #9146FF, 0 10px 24px rgba(145,70,255,.18)">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5F5A6E" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M11 4a7 7 0 1 1 0 14a7 7 0 0 1 0-14zM20 20l-3.6-3.6"></path></svg>
        <span style="font-size: 22px; font-weight: 700">{{query}}</span><span style="width: 2px; height: 26px; background: #9146FF; margin-left: -8px"></span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px">
        <sc-for list="{{keys}}" as="k" hint-placeholder-count="36">
          <button onClick="{{k.press}}" style="{{k.style}}">{{k.label}}</button>
        </sc-for>
      </div>
      <div style="display: flex; gap: 8px">
        <button onClick="{{space}}" style="flex-grow: 1; height: 48px; border-radius: 12px; border: 1px solid #E2DFEA; background: #FFFFFF; font-size: 14px; font-weight: 700; color: #3E3A4A">Пробел</button>
        <button onClick="{{erase}}" aria-label="Стереть" style="width: 64px; height: 48px; border-radius: 12px; border: 1px solid #E2DFEA; background: #FFFFFF; display: flex; align-items: center; justify-content: center">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3E3A4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5h11v14H9l-6-7zM13 10l4 4M17 10l-4 4"></path></svg>
        </button>
        <button style="width: 76px; height: 48px; border-radius: 12px; border: 1px solid #E2DFEA; background: #FFFFFF; font-size: 13px; font-weight: 800; color: #3E3A4A">РУС</button>
        <button aria-label="Голосовой поиск" style="width: 64px; height: 48px; border-radius: 12px; border: none; background: #9146FF; display: flex; align-items: center; justify-content: center">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3zM5 11a7 7 0 0 0 14 0M12 18v3"></path></svg>
        </button>
      </div>
    </section>

    <section aria-label="Результаты" style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 26px">
      <div style="display: flex; flex-direction: column; gap: 14px">
        <h2 style="margin: 0; font-size: 20px; font-weight: 800">Каналы</h2>
        <div style="display: flex; flex-direction: column; gap: 8px">
          <sc-for list="{{channels}}" as="c" hint-placeholder-count="4">
            <button onClick="{{c.pick}}" style="{{c.rowStyle}}">
              <span style="{{c.avatar}}"></span>
              <span style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0; text-align: left">
                <span style="font-size: 16px; font-weight: 800">{{c.name}}</span>
                <span style="font-size: 13px; color: #5F5A6E; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{c.sub}}</span>
              </span>
              <sc-if value="{{c.live}}" hint-placeholder-val="{{ true }}">
                <span style="padding: 4px 9px; border-radius: 8px; background: #E91916; color: #FFFFFF; font-size: 11px; font-weight: 800; letter-spacing: .04em">LIVE</span>
              </sc-if>
              <sc-if value="{{c.offline}}" hint-placeholder-val="{{ false }}">
                <span style="padding: 4px 9px; border-radius: 8px; background: #EFEDF5; color: #5F5A6E; font-size: 11px; font-weight: 700">Офлайн</span>
              </sc-if>
            </button>
          </sc-for>
        </div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 14px">
        <h2 style="margin: 0; font-size: 20px; font-weight: 800">Категории</h2>
        <div style="display: flex; gap: 18px">
          <sc-for list="{{cats}}" as="g" hint-placeholder-count="3">
            <div style="display: flex; flex-direction: column; gap: 8px; width: 110px">
              <span style="{{g.cover}}"><span style="{{g.shape}}"></span></span>
              <span style="font-size: 13px; font-weight: 700">{{g.name}}</span>
            </div>
          </sc-for>
        </div>
      </div>
    </section>
  </main>
  <div style="position: absolute; left: 0; top: 0; bottom: 0">
    <dc-import name="Rail" expanded="{{no}}" active="search" hint-size="88px,720px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { query: 'kot', focusKey: 't', focusRow: 0 }; }
  renderVals() {
    const A = '#9146FF';
    const chars = 'abcdefghijklmnopqrstuvwxyz1234567890_-'.split('').slice(0, 35);
    const keys = chars.map((ch) => {
      const f = this.state.focusKey === ch;
      return {
        label: ch,
        press: () => this.setState({ query: this.state.query + ch, focusKey: ch }),
        style: 'height: 46px; border-radius: 12px; font-size: 17px; font-weight: 700; cursor: pointer; ' +
          (f ? 'border: none; background: ' + A + '; color: #FFFFFF; box-shadow: 0 8px 18px rgba(145,70,255,.3);' : 'border: 1px solid #E2DFEA; background: #FFFFFF; color: #17151F;')
      };
    });
    const ch = [
      ['kotofey', 'Minecraft · Выживание: день 47, строим базу', '#64E0C6', true],
      ['kotik_live', 'Just Chatting · Котики и чай', '#FFC857', true],
      ['kot_baton', 'Последний эфир 2 дня назад', '#FF8A5B', false],
      ['kotlin_dev', 'Последний эфир неделю назад', '#7FB2FF', false]
    ];
    const channels = ch.map((c, i) => {
      const f = this.state.focusRow === i;
      return {
        name: c[0], sub: c[1], live: c[3], offline: !c[3],
        pick: () => this.setState({ focusRow: i }),
        rowStyle: 'all: unset; cursor: pointer; box-sizing: border-box; display: flex; align-items: center; gap: 14px; height: 68px; padding: 0 16px; border-radius: 16px; ' +
          (f ? 'background: #FFFFFF; box-shadow: 0 0 0 3px ' + A + ', 0 12px 26px rgba(145,70,255,.2);' : 'background: #FFFFFF; box-shadow: 0 1px 0 #E8E5F0;'),
        avatar: 'width: 44px; height: 44px; flex-shrink: 0; border-radius: 22px; background: ' + c[2] + ';' + (c[3] ? ' box-shadow: 0 0 0 3px #FFFFFF, 0 0 0 5px #E91916;' : ' opacity: .6;')
      };
    });
    const cats = [['Котики и животные', '#2B1E4A', '#FF8A5B'], ['Kotlin', '#1C2A48', '#7FB2FF'], ['Kotor II', '#123A3A', '#64E0C6']].map((g, i) => ({
      name: g[0],
      cover: 'position: relative; overflow: hidden; display: block; width: 110px; height: 146px; border-radius: 12px; background: ' + g[1] + ';',
      shape: 'position: absolute; width: 70px; height: 70px; border-radius: ' + (i % 2 ? '50%' : '20px') + '; left: 20px; top: 34px; background: ' + g[2] + ';'
    }));
    return {
      keys, channels, cats, query: this.state.query, no: false,
      space: () => this.setState({ query: this.state.query + ' ' }),
      erase: () => this.setState({ query: this.state.query.slice(0, -1) })
    };
  }
}
</script>
</body>
</html>
