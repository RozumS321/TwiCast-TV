<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Плеер</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#772CE8}a:hover{color:#5C16C5}
button{font-family:inherit}
</style>
</helmet>
<div style="position: relative; width: 1280px; height: 720px; overflow: hidden; background: #0F0E14; color: #17151F; font-family: 'Plus Jakarta Sans', system-ui, sans-serif">

  <div aria-label="Видео стрима" style="{{videoStyle}}">
    <span style="position: absolute; width: 380px; height: 380px; border-radius: 50%; right: 18%; top: 14%; background: #FF8A5B; opacity: .85"></span>
    <span style="position: absolute; width: 220px; height: 220px; border-radius: 50%; left: 12%; bottom: 10%; background: #9146FF; opacity: .35"></span>
    <span style="position: absolute; left: 40px; top: 36px; padding: 4px 9px; border-radius: 8px; background: #E91916; color: #FFFFFF; font-size: 12px; font-weight: 800; letter-spacing: .04em">LIVE</span>
  </div>

  <sc-if value="{{isControls}}" hint-placeholder-val="{{ true }}">
    <section aria-label="Панель управления" style="position: absolute; left: 40px; right: 40px; bottom: 40px; box-sizing: border-box; padding: 20px 24px; border-radius: 20px; background: rgba(15,14,20,.78); display: flex; align-items: center; gap: 16px">
      <span style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 22px; background: #64E0C6; box-shadow: 0 0 0 2px #0F0E14, 0 0 0 4px #9146FF"></span>
      <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 18px; font-weight: 800; color: #FFFFFF">sasavot</span>
        <span style="font-size: 14px; color: #CFCBD9; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Just Chatting · 15,3 тыс зрителей · 3 ч в эфире</span>
      </div>
      <sc-for list="{{buttons}}" as="b" hint-placeholder-count="3">
        <button onClick="{{b.pick}}" style="{{b.style}}">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{b.iconColor}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{b.d}}"></path></svg>
          {{b.label}}
        </button>
      </sc-for>
    </section>
  </sc-if>

  <sc-if value="{{isQuality}}" hint-placeholder-val="{{ false }}">
    <aside aria-label="Качество видео" style="position: absolute; top: 0; right: 0; bottom: 0; width: 400px; box-sizing: border-box; padding: 40px 28px; background: #FFFFFF; display: flex; flex-direction: column; gap: 6px; box-shadow: -24px 0 60px rgba(0,0,0,.35)">
      <h2 style="margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -0.01em">Качество</h2>
      <span style="font-size: 13px; color: #5F5A6E; margin-bottom: 14px">Запомним для следующих стримов</span>
      <sc-for list="{{qualities}}" as="q" hint-placeholder-count="6">
        <button onClick="{{q.pick}}" style="{{q.style}}">
          <span>{{q.label}}</span>
          <span style="{{q.hintStyle}}">{{q.hint}}</span>
        </button>
      </sc-for>
    </aside>
  </sc-if>

  <sc-if value="{{isChat}}" hint-placeholder-val="{{ false }}">
    <aside aria-label="Чат" style="position: absolute; top: 0; right: 0; bottom: 0; width: 384px; box-sizing: border-box; padding: 28px 24px; background: #FFFFFF; border-left: 1px solid #E8E5F0; display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; align-items: baseline; justify-content: space-between">
        <h2 style="margin: 0; font-size: 20px; font-weight: 800">Чат</h2>
        <span style="font-size: 13px; color: #5F5A6E">только чтение</span>
      </div>
      <sc-for list="{{messages}}" as="m" hint-placeholder-count="8">
        <p style="margin: 0; font-size: 15px; line-height: 1.45; color: #3E3A4A"><b style="{{m.nameStyle}}">{{m.name}}</b> {{m.text}}</p>
      </sc-for>
      <span style="margin-top: auto; font-size: 13px; color: #5F5A6E">Назад — скрыть чат</span>
    </aside>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"state":{"editor":"enum","options":["controls","quality","chat"],"default":"controls"},"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { focus: 0, quality: 2 }; }
  renderVals() {
    const A = '#9146FF';
    const mode = this.props.state ?? 'controls';
    const icons = {
      pause: 'M8 5v14M16 5v14',
      quality: 'M4 7h9M17 7h3M15 5v4M4 17h3M11 17h9M9 15v4',
      chat: 'M4 5h16v11H9l-5 4z'
    };
    const buttons = [['pause', 'Пауза'], ['quality', 'Качество · 720p60'], ['chat', 'Чат']].map(([key, label], i) => {
      const f = this.state.focus === i;
      return {
        label, d: icons[key], iconColor: '#17151F',
        pick: () => this.setState({ focus: i }),
        style: 'all: unset; cursor: pointer; display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 22px; border-radius: 16px; background: #FFFFFF; color: #17151F; font-size: 16px; font-weight: 700; box-sizing: border-box; transition: transform .2s, box-shadow .2s; ' +
          (f ? 'transform: scale(1.05); box-shadow: 0 0 0 3px ' + A + ';' : 'box-shadow: inset 0 0 0 1px #E2DFEA;')
      };
    });
    const qualities = [['Авто', 'сейчас 1080p60'], ['1080p60', ''], ['720p60', 'выбрано'], ['480p', ''], ['360p', ''], ['160p', '']].map(([label, hint], i) => {
      const f = this.state.quality === i;
      return {
        label, hint,
        pick: () => this.setState({ quality: i }),
        hintStyle: 'font-size: 13px; font-weight: 600; color: ' + (f ? '#FFFFFF' : '#5F5A6E') + ';',
        style: 'all: unset; cursor: pointer; display: flex; align-items: center; justify-content: space-between; height: 52px; padding: 0 18px; border-radius: 16px; font-size: 16px; box-sizing: border-box; ' +
          (f ? 'background: ' + A + '; color: #FFFFFF; font-weight: 700; box-shadow: 0 10px 24px rgba(145,70,255,.32);' : 'color: #17151F; font-weight: 600;')
      };
    });
    const people = [['kotofey', 'привет всем', '#9146FF'], ['nightowl_plays', 'го катку после стрима', '#1D9E75'], ['lofi_room', 'звук норм', '#D85A30'],
      ['devstream_ua', 'KEKW', '#9146FF'], ['smoke_lab', 'какой у тебя сетап?', '#378ADD'], ['arena_ua', 'лучший стрим недели', '#1D9E75'],
      ['kira_aim', 'а когда розыгрыш?', '#D85A30'], ['pixelmira', 'всем хорошего вечера', '#9146FF']];
    const messages = people.map(([name, text, c]) => ({ name, text, nameStyle: 'font-weight: 800; color: ' + c + ';' }));
    return {
      isControls: mode === 'controls', isQuality: mode === 'quality', isChat: mode === 'chat',
      buttons, qualities, messages,
      videoStyle: 'position: absolute; top: 0; bottom: 0; left: 0; right: ' + (mode === 'chat' ? '384px' : '0') + '; overflow: hidden; background: #2B1E4A;'
    };
  }
}
</script>
</body>
</html>
