<!doctype html>
<!--
  Read-only chat for the TwiCast player: the official Twitch chat embed, nothing else.
  Served by WebViewAssetLoader from https://appassets.androidplatform.net (the `parent` Twitch checks).
  Query: ?channel= (validated in Kotlin), &title=, &hint=.
-->
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #fff; font-family: system-ui, sans-serif; }
    body { display: flex; flex-direction: column; border-left: 1px solid #E8E5F0; box-sizing: border-box; }
    header { display: flex; align-items: baseline; justify-content: space-between; padding: 20px 20px 12px; }
    h2 { margin: 0; font-size: 20px; font-weight: 800; color: #17151F; }
    span { font-size: 13px; color: #5F5A6E; }
    /* The embed brings its own header and message box (useless without a twitch.tv login here):
       the frame is clipped so only the message list shows. Offsets follow Twitch's current layout. */
    .frame { flex: 1; position: relative; overflow: hidden; }
    iframe { position: absolute; left: 0; width: 100%; border: 0; top: -50px; height: calc(100% + 50px + 250px); }
  </style>
</head>
<body>
<header><h2 id="title"></h2><span id="hint"></span></header>
<div class="frame" id="frame"></div>
<script>
  var params = new URLSearchParams(location.search);
  document.getElementById('title').textContent = params.get('title') || '';
  document.getElementById('hint').textContent = params.get('hint') || '';
  var frame = document.createElement('iframe');
  frame.src = 'https://www.twitch.tv/embed/' + encodeURIComponent(params.get('channel') || '') + '/chat?parent=' + location.hostname;
  document.getElementById('frame').appendChild(frame);
</script>
</body>
</html>
