<!doctype html>
<!--
  Wrapper around the official Twitch embeds (https://dev.twitch.tv/docs/embed/):
  the video player and, on demand, the read-only chat to its right — one WebView for both.
  Served by WebViewAssetLoader from https://appassets.androidplatform.net, which is the `parent` Twitch checks.
  Query: ?channel= (validated in Kotlin) and optional ?quality= (preferred quality group, e.g. 720p60).
  ?warm=1: started ahead of time (WarmTwitchPlayer) — no autoplay, muted, silent until twicast.load() picks the
  channel to watch; twicast.park() pauses and hides it again between streams.
  Kotlin → JS: window.twicast.*; JS → Kotlin: window.TwiCast.* (Android bridge).
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
    body { display: flex; }
    #player { flex: 1; min-width: 0; height: 100%; }
    #chat { display: none; width: 30%; height: 100%; flex-direction: column; background: #fff;
      border-left: 1px solid #E8E5F0; font-family: system-ui, sans-serif; }
    #chat header { display: flex; align-items: baseline; justify-content: space-between; padding: 20px 20px 12px; }
    #chat h2 { margin: 0; font-size: 20px; font-weight: 800; color: #17151F; }
    #chat span { font-size: 13px; color: #5F5A6E; }
    /* The chat embed brings its own header and message box (useless without a twitch.tv login in the WebView):
       the frame is clipped so only the message list shows. Offsets follow Twitch's current layout. */
    #chat .frame { flex: 1; position: relative; overflow: hidden; }
    #chat iframe { position: absolute; left: 0; width: 100%; border: 0;
      top: -50px; height: calc(100% + 50px + 250px); }
    body.with-chat #chat { display: flex; }
  </style>
  <!-- Open the connections the Twitch player needs while its script still loads (start is ~18 s on a TV box). -->
  <link rel="preconnect" href="https://player.twitch.tv">
  <link rel="preconnect" href="https://static.twitchcdn.net">
  <link rel="preconnect" href="https://gql.twitch.tv">
  <link rel="preconnect" href="https://usher.ttvnw.net">
  <script src="https://player.twitch.tv/js/embed/v1.js"></script>
</head>
<body>
<div id="player"></div>
<aside id="chat"><header><h2 id="chat-title"></h2><span id="chat-hint"></span></header><div class="frame" id="chat-frame"></div></aside>
<script>
  var bridge = window.TwiCast;
  var params = new URLSearchParams(location.search);
  var channel = params.get('channel');
  var preferredQuality = params.get('quality');
  // Instead of the live stream: a past broadcast (?video=<id>) or a clip (?clip=<slug>).
  var video = params.get('video');
  // A recording resumed where the viewer stopped (?start=<seconds>).
  var start = parseInt(params.get('start'), 10) || 0;
  var clip = params.get('clip');
  // Quality ceiling after a renderer crash (?maxHeight=720): decoding 1080p runs weak TV boxes out of memory.
  var maxHeight = parseInt(params.get("maxHeight"), 10) || 0;
  if (maxHeight) preferredQuality = null;
  var warm = params.get('warm') === '1';
  // A warm player says nothing to the app until a stream is opened in it.
  var active = !warm;

  function mark(label) { if (bridge && bridge.mark) bridge.mark(label, Math.round(performance.now())); }
  function report(state) { mark(state); if (active && bridge) bridge.onStateChanged(state); }
  mark(window.Twitch ? "embed script ready" : "embed script missing");

  /** Clips have their own embed without a JS API: no pause, quality or events beyond "loaded". */
  function playClip() {
    var frame = document.createElement('iframe');
    var src = 'https://clips.twitch.tv/embed?clip=' + encodeURIComponent(clip) +
      '&parent=' + location.hostname + '&autoplay=true&muted=false';
    frame.src = src;
    frame.allow = 'autoplay; fullscreen';
    frame.style.cssText = 'width:100%;height:100%;border:0';
    frame.onload = function () { report('playing'); };
    document.getElementById('player').appendChild(frame);
    window.twicast = {
      togglePause: function () {}, setQuality: function () {}, setChatVisible: function () {}, seek: function () {},
      // No pause in the clip embed: unload it in the background, a short clip just starts over.
      background: function () { frame.src = 'about:blank'; },
      foreground: function () { frame.src = src; }
    };
  }

  function heightOf(q) { return parseInt(typeof q === "string" ? q : (q.name || q.group), 10) || 0; }

  /** Keeps the stream at or below maxHeight: the best quality that fits, never "auto" (it would climb back). */
  function capQuality(player) {
    var list = player.getQualities() || [];
    var current = list.filter(function (q) { return (q.group || q.name || q) === player.getQuality(); })[0];
    if (current && heightOf(current) > 0 && heightOf(current) <= maxHeight) return;
    var fitting = list.filter(function (q) { var h = heightOf(q); return h > 0 && h <= maxHeight; })
      .sort(function (a, b) { return heightOf(b) - heightOf(a); })[0];
    if (fitting) { player.setQuality(fitting.group || fitting.name || fitting); mark("quality capped"); }
  }

  /** Twitch returns objects ({name, group, ...}); `group` is what setQuality() takes. */
  function reportQualities(player) {
    if (!bridge) return;
    var list = (player.getQualities() || []).map(function (q) {
      return typeof q === 'string' ? { id: q, label: q } : { id: q.group || q.name, label: q.name || q.group };
    });
    bridge.onQualities(JSON.stringify(list), player.getQuality() || '');
  }

  if (clip) {
    playClip();
  } else if (!window.Twitch || !channel) {
    report('error');
  } else {
    var source = video ? { video: video } : { channel: channel };
    // The embed takes a recording's start as "1h24m10s".
    if (video && start) source.time = Math.floor(start / 3600) + 'h' + Math.floor(start % 3600 / 60) + 'm' + (start % 60) + 's';
    var player = new Twitch.Player('player', Object.assign(source, {
      parent: [location.hostname],
      width: '100%', height: '100%', autoplay: !warm, muted: warm,
      // Our own controls replace Twitch's overlay (follow / sub buttons are not usable with a remote anyway).
      controls: false
    }));
    var playerReady = false;
    var pendingLoad = null;
    player.addEventListener(Twitch.Player.READY, function () {
      playerReady = true;
      report('ready');
      if (pendingLoad) { var load = pendingLoad; pendingLoad = null; window.twicast.load(load); }
    });

    function removeChatFrame() {
      var frame = document.querySelector('#chat-frame iframe');
      if (frame) frame.remove();
      document.body.classList.remove('with-chat');
    }
    player.addEventListener(Twitch.Player.PLAYING, function () {
      report('playing');
      // The quality list exists only once the stream plays, and Twitch resets it to "auto" after every ad break:
      // re-apply the viewer's choice each time.
      if (preferredQuality && player.getQuality() !== preferredQuality) player.setQuality(preferredQuality);
      if (maxHeight) capQuality(player);
      reportQualities(player);
    });
    player.addEventListener(Twitch.Player.PAUSE, function () { report('paused'); });
    player.addEventListener(Twitch.Player.OFFLINE, function () { report('offline'); });
    // A recording that ended is just paused at the end; only a live stream goes "offline".
    player.addEventListener(Twitch.Player.ENDED, function () { report(video ? 'paused' : 'offline'); });

    // A recording tells the app where it is, for the seek bar.
    setInterval(function () {
      if (!active || !video || !bridge || !bridge.onProgress) return;
      var duration = player.getDuration();
      if (duration > 0) bridge.onProgress(player.getCurrentTime(), duration);
    }, 1000);

    // Set while the app is in the background: only what was playing resumes, a viewer's pause stays.
    var resumeOnForeground = false;

    window.twicast = {
      /** Opens a stream in the already loaded player: { channel, video, quality, maxHeight }. */
      load: function (opts) {
        if (!playerReady) { pendingLoad = opts; return; }
        active = true;
        mark('load ' + (opts.video || opts.channel));
        channel = opts.channel;
        video = opts.video || null;
        maxHeight = opts.maxHeight || 0;
        preferredQuality = maxHeight ? null : (opts.quality || null);
        removeChatFrame();
        if (video) player.setVideo(video, opts.start || 0); else player.setChannel(channel);
        player.setMuted(false);
        player.play();
      },
      /** Between streams: stopped, muted and silent, ready for the next load(). */
      park: function () {
        active = false;
        pendingLoad = null;
        resumeOnForeground = false;
        removeChatFrame();
        player.pause();
        player.setMuted(true);
      },
      togglePause: function () { if (player.isPaused()) player.play(); else player.pause(); },
      seek: function (seconds) { player.seek(seconds); },
      background: function () {
        resumeOnForeground = !player.isPaused();
        if (resumeOnForeground) player.pause();
      },
      foreground: function () {
        if (resumeOnForeground) player.play();
        resumeOnForeground = false;
      },
      // The viewer's own choice lifts the crash ceiling.
      setQuality: function (id) { maxHeight = 0; preferredQuality = id; player.setQuality(id); reportQualities(player); },
      setChatVisible: function (visible, title, hint) {
        var frameBox = document.getElementById('chat-frame');
        if (visible && !frameBox.querySelector('iframe')) {
          // Created on first show: no chat traffic for viewers who never open it.
          var frame = document.createElement('iframe');
          frame.src = 'https://www.twitch.tv/embed/' + encodeURIComponent(channel) + '/chat?parent=' + location.hostname;
          frameBox.appendChild(frame);
        }
        document.getElementById('chat-title').textContent = title || '';
        document.getElementById('chat-hint').textContent = hint || '';
        document.body.classList.toggle('with-chat', visible);
      }
    };
  }
</script>
</body>
</html>
