# R8 runs inside the Gradle daemon: with 4 GB it spent most of a release build collecting garbage.
org.gradle.jvmargs=-Xmx6g -XX:+UseParallelGC -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx3g
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# CI runs the unit tests on the release variant (one compilation shared with the APK); local checks use debug.
android.onlyEnableUnitTestForTheTestedBuildType=false
